[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-browser"
version = "1.0.0"
description = "Autonomous AI Agent Browser Application with NLP-driven web automation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Adam Browser Team", email = "team@adambrowser.ai"}
]
keywords = ["ai", "browser", "automation", "nlp", "playwright", "wxpython"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.41.0",
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "wxPython>=4.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=41.0.0",
    "loguru>=0.7.0",
    "toml>=0.10.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]
ollama = [
    "ollama>=0.1.7",
]

[project.urls]
Homepage = "https://github.com/ai-in-pm/AdamBrowser"
Documentation = "https://docs.adambrowser.ai"
Repository = "https://github.com/ai-in-pm/AdamBrowser.git"
"Bug Tracker" = "https://github.com/ai-in-pm/AdamBrowser/issues"

[project.scripts]
adam-browser = "adam_browser.main:main"
adam-cli = "adam_browser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["adam_browser*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | wxWidgets-master
  | bert-base-uncased-mrpc
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "wxWidgets-master/",
    "bert-base-uncased-mrpc/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["adam_browser"]
omit = [
    "*/tests/*",
    "*/wxWidgets-master/*",
    "*/bert-base-uncased-mrpc/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
